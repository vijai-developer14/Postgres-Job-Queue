name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
          POSTGRES_DB: job_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Create jobs table
        run: |
          PGPASSWORD=jobqueue psql -h localhost -U jobqueue -d job_queue -f schema.sql

      - name: Run tests
        env:
          DB_USERNAME: jobqueue
          DB_PASS: jobqueue
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: job_queue
        run: node --test